server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/khatm}
    username: ${SPRING_DATASOURCE_USERNAME:khatm}
    password: ${SPRING_DATASOURCE_PASSWORD:khatm}
  jpa:
    hibernate:
      # KH-0.2.1: Flyway is now the only source of schema truth. Hibernate only verifies
      # that entity mappings match the migrated schema; it never creates or alters DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # KH-0.2.2: explicit even though it's Flyway's own default — this is the runtime half of
    # the append-only migration guard. MigrationImmutabilityTest catches edits to an applied
    # migration at build time by comparing checksums against db/migration-checksums.lock;
    # validate-on-migrate catches the same class of drift at startup against whatever a real
    # database's flyway_schema_history table actually recorded, so a modified migration file
    # fails fast even if someone bypasses the build-time check.
    validate-on-migrate: true

khatm:
  issuer-did: "did:web:khatm.sy:demo"
  key-id: "khatm-key-1"

logging:
  level:
    sy.khatm: INFO
