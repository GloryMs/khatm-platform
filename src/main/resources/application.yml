server:
  port: 8080
  servlet:
    session:
      # KH-0.6b (spec FS-0.6b D1/§7): khatm.auth.session.timeout below is the single source of
      # truth — this just points Spring Session (spring-session-data-redis, on the classpath) at
      # it, since Boot's SessionAutoConfiguration falls back to this property when
      # spring.session.timeout is unset.
      timeout: ${khatm.auth.session.timeout}
      cookie:
        name: KHATM_SESSION
        http-only: true
        same-site: lax
        # Secure outside 'local' (D1) — the 'local' profile document below turns this off so a
        # plain http://localhost console dev loop still gets the cookie back.
        secure: true

spring:
  session:
    store-type: redis
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/khatm}
    username: ${SPRING_DATASOURCE_USERNAME:khatm}
    password: ${SPRING_DATASOURCE_PASSWORD:khatm}
  jpa:
    hibernate:
      # KH-0.2.1: Flyway is now the only source of schema truth. Hibernate only verifies
      # that entity mappings match the migrated schema; it never creates or alters DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    jpa:
      repositories:
        # KH-2.1 Part B (spec FS-2.1 D4): without this, Spring Data JPA's derived query methods
        # (e.g. IssuerKeyRepository#countByTenantId, CredentialRepository#findSchemaId) are only
        # transactional when called from inside another @Transactional method — invoked bare (a
        # handful of production call sites are deliberately non-transactional for unrelated reasons,
        # e.g. CredentialService#enforceSchemaAllowlist's independent-commit requirement), they run
        # with no Spring-managed transaction at all, so
        # shared.TenantContextTransactionExecutionListener never fires and app.tenant_id is never
        # set — RLS then closed-fails to zero rows regardless of the real data, which silently
        # turned enforceSchemaAllowlist's "can't resolve this schema, don't block" fallback into
        # "can never resolve any schema, always allow" (caught by ConsumeApiKeyGateTest). This makes
        # every repository method safe to call standalone, matching Spring Data's own intended
        # default.
        enable-default-transactions: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # KH-0.2.2: explicit even though it's Flyway's own default — this is the runtime half of
    # the append-only migration guard. MigrationImmutabilityTest catches edits to an applied
    # migration at build time by comparing checksums against db/migration-checksums.lock;
    # validate-on-migrate catches the same class of drift at startup against whatever a real
    # database's flyway_schema_history table actually recorded, so a modified migration file
    # fails fast even if someone bypasses the build-time check.
    validate-on-migrate: true

khatm:
  issuer-did: "did:web:khatm.sy:demo"
  # The externally-reachable base URL PublicUrlBuilder roots every self-referential URL at (today:
  # only the public GET /sl/{tenantSlug}/{listCode} status-list URI, spec FS-1.3 D2/D7). No default
  # here on purpose — PublicUrlBuilder fails startup if this is blank outside the 'local' profile
  # (same no-silent-default pattern as khatm.keys.soft.passphrase/khatm.claims.enc-key below). A
  # real deployment sets KHATM_PUBLIC_BASE_URL to its actual public origin; 'http://localhost:8080'
  # is never a safe default outside a developer's own machine — a wallet on a phone can't resolve
  # it. The 'local' profile document below supplies the only permitted default.
  public-base-url: ${KHATM_PUBLIC_BASE_URL:}
  keys:
    # KH-0.5 (spec FS-0.5 §7): SOFT today; KMS/PKCS11 later are a config change only (D3).
    provider: SOFT
    # KH-2.3a (spec FS-2.3 D4/V4): a RETIRING key must stay RETIRING for at least this long before
    # POST /api/v1/admin/signing-keys/{kid}/retire is allowed to retire it (force=true bypasses,
    # audited) — protects long-lived offline documents that may not resync their verifier's JWKS
    # cache for a while.
    min-retiring-age: P30D
    soft:
      keystore-path: ${KHATM_KEYS_KEYSTORE_PATH:/var/khatm/keys/khatm-keys.p12}
      # No default here on purpose — SoftKeyProvider fails startup if this is blank outside the
      # 'local' profile (spec FS-0.5 §3/§8.5). The 'local' profile document below supplies the
      # only permitted default.
      passphrase: ${KHATM_KEYS_PASSPHRASE:}
  claims:
    # KH-0.4 (spec FS-0.4 D7): AES-256-GCM key for claim_code.disclosures_enc, 32 raw bytes
    # base64-encoded. Same no-silent-default pattern as khatm.keys.soft.passphrase above —
    # ClaimsEncryptionService fails startup if this is blank outside the 'local' profile.
    enc-key: ${KHATM_CLAIMS_ENC_KEY:}
    redeem:
      # KH-1.2.1 (spec FS-1.2.1 D6): per-IP fixed-window throttle on POST /api/v1/claims/redeem —
      # the platform's only genuinely public write endpoint besides /verify.
      throttle:
        max-attempts: 10
        window: 1m
  # KH-0.6b (spec FS-0.6b §7): console auth, API keys, RBAC.
  auth:
    session:
      timeout: 30m
    lockout:
      max-attempts: 5
      window: 15m
    totp:
      # KH-2.2c (spec FS-2.2 V1): AES-256-GCM key for app_user.totp_secret_enc, 32 raw bytes
      # base64-encoded. Same no-silent-default pattern as khatm.claims.enc-key above —
      # TotpSecretEncryptionService fails startup if this is blank outside the 'local' profile.
      enc-key: ${KHATM_AUTH_TOTP_ENC_KEY:}
      # How long a pending (unconfirmed) enrollment stays confirmable before it must be redone.
      enroll-ttl: PT10M
      # How long a login's TOTP-challenge token stays valid (spec FS-2.2 V1's login-challenge step).
      challenge-ttl: PT5M
    bootstrap:
      # No default here on purpose — AdminBootstrap fails startup if either is blank outside the
      # 'local' profile (spec FS-0.6b D10, same no-silent-default pattern as khatm.keys.soft.*
      # above). The 'local' profile document below supplies the only permitted default.
      admin-username: ${KHATM_BOOTSTRAP_ADMIN_USERNAME:}
      admin-password: ${KHATM_BOOTSTRAP_ADMIN_PASSWORD:}
  # ADR-09: one image, two runtime roles selected by Spring profile. These defaults are api-like
  # (publishes events, exposes REST, runs no stream consumers); the 'worker' profile document below
  # flips them. khatm.role is read by RoleStartupLogger; the flags drive the @ConditionalOnProperty
  # gating on controllers (khatm.web.enabled) and worker beans (khatm.worker.enabled).
  role: api
  web:
    enabled: true
  worker:
    enabled: false
    stream:
      # How often the Redis Streams consumer polls for new + pending entries (ADR-09 backbone).
      poll-interval-ms: 2000
      # Handler failures before an entry is moved to the dead-letter stream (task step 4; N
      # configurable). Default 3 per the task contract.
      max-attempts: 3
      # Redis Streams consumer group + the stream each externalized credential event lands on.
      group: khatm-workers
      credential-events-stream: khatm.credential.events
      dlq-stream: khatm.dlq
    claim-code:
      # FS-0.2 §3.7 expiry-zeroing sweep interval. Default 300000 ms = 5 minutes (task step 5a).
      expiry-sweep-ms: 300000
  status:
    publish:
      # KH-1.3 (spec FS-1.3 D5/§3): periodic catch-up sweep interval — republishes any status list
      # whose signed artifact has fallen behind (or never existed). Complements the event-driven
      # StatusListChangedHandler (near-real-time path, bounded by khatm.worker.stream.poll-interval-ms
      # above) the same way ClaimCodeExpiryWorker complements ClaimRedemptionService's on-claim
      # zeroing — a safety net, not the only path. Default 2000ms comfortably clears NFR-06's ≤60s
      # revoke-to-publish budget; tests configure it short to assert the latency bound directly.
      debounce: 2000
  stats:
    attention:
      # KH-1.1.5-BE (spec FS-1.5.4 D6): GET /api/v1/attention's starter thresholds. All MVP
      # defaults, not documented product requirements — tune freely, no contract/shape change.
      window: PT24H # how far back CONSUME_SCHEMA_DENIED rows are still "recent"
      cap: 20 # max schema-denied items returned
      verify-window: PT1H # length of the current/baseline verify-failure-rate windows
      verify-failure-multiplier: 3.0 # flag when current rate >= this many times the baseline
      verify-min-volume: 5 # floor on the current window's total verify attempts, avoids noise

logging:
  level:
    sy.khatm: INFO

# Resolved by Maven resource filtering (@...@ delimiter, enabled by the inherited
# spring-boot-starter-parent POM for application.yml) — see shared.config.OpenApiConfig.
project:
  version: "@project.version@"

springdoc:
  swagger-ui:
    # Swagger UI's own "Try it out" reads the XSRF-TOKEN cookie and sends it back as
    # X-XSRF-TOKEN automatically, so a POST through the UI survives sessionSecurityFilterChain's
    # CSRF check without manual header copying (KH-0.6b CookieCsrfTokenRepository).
    csrf:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: api
khatm:
  role: api
  web:
    enabled: true
  worker:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: worker
khatm:
  role: worker
  web:
    # The worker image runs stream consumers and exposes no business REST endpoints (ADR-09).
    # Gating flags off CredentialController + JwksController via @ConditionalOnProperty.
    enabled: false
  worker:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
khatm:
  events:
    # The existing shared-context test suite (IntegrationTestSupport) has no Redis container.
    # Disable Modulith→Redis externalization there so issue()'s CredentialIssued event never
    # attempts an XADD. The worker-stream integration tests override this to true and bring their
    # own Redis Testcontainer.
    externalize: false

---
spring:
  config:
    activate:
      on-profile: local

server:
  servlet:
    session:
      cookie:
        # Plain http://localhost dev loop — no TLS, so Secure would silently drop the cookie.
        secure: false

khatm:
  # Documented local-only default so `docker compose up` / a bare local run work with zero setup.
  # Never used outside 'local' — PublicUrlBuilder enforces that. Overridden explicitly in
  # docker-compose.yml (see README "Running locally" — LAN IP note) when a real device on the same
  # network needs to dereference this URL, since 'localhost' only resolves on the host machine.
  public-base-url: ${KHATM_PUBLIC_BASE_URL:http://localhost:8080}
  keys:
    soft:
      # Documented local-only default so `docker compose up` / a bare local run work with zero
      # setup (spec FS-0.5 §3). Never used outside 'local' — SoftKeyProvider enforces that.
      passphrase: ${KHATM_KEYS_PASSPHRASE:khatm-local-dev-passphrase-change-me}
  claims:
    # Documented local-only default, 32 raw bytes base64-encoded (spec FS-0.4 D7). Never used
    # outside 'local' — ClaimsEncryptionService enforces that.
    enc-key: ${KHATM_CLAIMS_ENC_KEY:a2hhdG0tbG9jYWwtZGV2LWNsYWltcy1lbmMta2V5ISE=}
  auth:
    totp:
      # Documented local-only default, 32 raw bytes base64-encoded (spec FS-2.2 V1). Never used
      # outside 'local' — TotpSecretEncryptionService enforces that.
      enc-key: ${KHATM_AUTH_TOTP_ENC_KEY:a2hhdG0tbG9jYWwtZGV2LXRvdHAtZW5jLWtleSEhISE=}
    bootstrap:
      # Documented local-only default (spec FS-0.6b D10) so `docker compose up` / a bare local
      # run provision a working console admin with zero setup. Never used outside 'local' —
      # AdminBootstrap enforces that.
      admin-username: ${KHATM_BOOTSTRAP_ADMIN_USERNAME:admin}
      admin-password: ${KHATM_BOOTSTRAP_ADMIN_PASSWORD:khatm-local-dev-admin-change-me}
