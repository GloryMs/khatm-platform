# khatm-platform — حزمة الرسائل العربية (قاعدة العمل 2 في CLAUDE.md، spec FS-0.6a).
# NOTE FOR THE PR REVIEWER (spec FS-0.6a §4): this file needs the human Arabic-speaker
# review gate before merge — see the PR description.
# يجب أن تكون المفاتيح مطابقة تماماً لملف messages_en.properties في الاتجاهين —
# MessageBundleParityTest يُسقط البناء عند أي نقص. لا تُضف مفتاحاً في حزمة واحدة فقط.

