verify.reason.valid=الوثيقة صالحة.
verify.reason.valid_signature_unknown_ref=التوقيع صحيح، إلا أن هذه الوثيقة غير مسجَّلة في هذه المنصة.
verify.reason.bad_signature=التوقيع غير صحيح.
verify.reason.unknown_kid=مفتاح التوقيع غير معروف أو لم يعد موثوقاً به.
verify.reason.expired=انتهت صلاحية الوثيقة.
verify.reason.revoked=تم إبطال الوثيقة.
verify.reason.bad_sd_alg=تستخدم الوثيقة خوارزمية غير مدعومة.
verify.reason.forged_disclosure=تعذّر التحقق من قيمة واحدة أو أكثر من القيم المكشوف عنها.
verify.reason.duplicate_disclosure=تم الكشف عن حقل واحد أكثر من مرة.
verify.reason.withheld_mandatory_claim=لم يُكشف عن حقل إلزامي.
verify.reason.malformed=العرض المقدَّم ليس وثيقة صالحة.

