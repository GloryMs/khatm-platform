# ── رسائل ErrorCode (shared.error.ErrorCode) ─────────────────────────────────────────────────
credential.not-found=الوثيقة غير موجودة.
credential.not-claimable=تم إبطال هذه الوثيقة أو انتهت صلاحيتها، ولم يعد بالإمكان إصدار كود مطالبة جديد لها.
key.signing-failed=تعذّر توقيع الوثيقة. يرجى المحاولة مرة أخرى.
validation.failed=فشل التحقق من صحة الطلب.
system.unexpected-error=حدث خطأ غير متوقع. يرجى المحاولة لاحقاً.
error.rbc.unauthenticated=المصادقة مطلوبة، أو أن بيانات الاعتماد المقدَّمة غير صحيحة.
error.rbc.api_key_invalid=مفتاح الـ API غير صالح أو مشوّه أو تم إبطاله.
error.rbc.forbidden=لا تملك الصلاحية اللازمة لتنفيذ هذا الإجراء.
schema.not-found=المخطط غير موجود.
error.clm.invalid_or_expired=كود المطالبة غير صالح أو منتهي الصلاحية.
error.clm.throttled=عدد محاولات المطالبة كبير جداً. يرجى المحاولة لاحقاً.
status.not-found=قائمة الحالة غير موجودة.
consumer.schema-not-allowed=لا يُسمح لهذه الجهة المستهلكة باستهلاك وثائق من هذا المخطط.
schema.validation-failed=تعريف المخطط غير صالح: {0}.
schema.immutable-after-publish=لا يمكن تعديل حقول مخطط تم نشره. يرجى إنشاء نسخة جديدة بدلاً من ذلك.
schema.invalid-transition=هذا الإجراء غير مسموح به في ظل الحالة الراهنة للمخطط.

