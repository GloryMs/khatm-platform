# khatm-platform — English message bundle (CLAUDE.md work rule 2, spec FS-0.6a).
# Keys must exist in BOTH messages_en.properties and messages_ar.properties, in lockstep —
# MessageBundleParityTest fails the build otherwise. Do not hand-add a key to one bundle only.

# ── ErrorCode messages (shared.error.ErrorCode) ──────────────────────────────────────────────
credential.not-found=Credential not found.
credential.not-claimable=This credential has been revoked or has expired and can no longer accept a claim code.
key.signing-failed=Failed to sign the credential. Please try again.
validation.failed=The request failed validation.
system.unexpected-error=An unexpected error occurred. Please try again later.
error.rbc.unauthenticated=Authentication required, or the credentials provided are incorrect.
error.rbc.api_key_invalid=The API key is invalid, malformed, or has been revoked.
error.rbc.forbidden=You do not have permission to perform this action.
schema.not-found=Schema not found.
error.clm.invalid_or_expired=This claim code is invalid or has expired.
error.clm.throttled=Too many claim attempts. Please try again later.
status.not-found=Status list not found.
consumer.schema-not-allowed=This consuming party is not permitted to consume credentials of this schema.

# ── VerifyReason messages (shared.error.VerifyReason) ────────────────────────────────────────
verify.reason.valid=The credential is valid.
verify.reason.valid_signature_unknown_ref=The signature is valid, but this credential is not recorded on this platform.
verify.reason.bad_signature=The signature is invalid.
verify.reason.unknown_kid=The signing key is unknown or no longer trusted.
verify.reason.expired=The credential has expired.
verify.reason.revoked=The credential has been revoked.
verify.reason.bad_sd_alg=The credential uses an unsupported digest algorithm.
verify.reason.forged_disclosure=One or more disclosed values could not be verified.
verify.reason.duplicate_disclosure=A claim was disclosed more than once.
verify.reason.withheld_mandatory_claim=A mandatory claim was not disclosed.
verify.reason.malformed=The presentation is not a valid credential.

# ── Bean Validation constraint messages (validation.<constraint>) ───────────────────────────
validation.NotBlank=This field is required.
