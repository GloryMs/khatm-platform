# Pins the docker-java client's negotiated Docker Engine API version.
#
# Without this, Testcontainers 1.20.x's default docker-java client negotiates too old an API
# version against Docker Engine 29+ (Docker Desktop 4.5x+), which responds with an empty-bodied
# HTTP 400 to /info instead of a clear error ("Could not find a valid Docker environment").
# See https://github.com/testcontainers/testcontainers-java/issues/11235.
api.version=1.44
