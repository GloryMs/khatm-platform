# khatm-platform — local dev compose (IntelliJ)
# Prereq (once): docker network create khatm-net
name: khatm-platform

services:
  khatm-postgres:
    image: postgres:16
    container_name: khatm-postgres
    environment:
      POSTGRES_DB: khatm
      POSTGRES_USER: khatm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khatm_local_only}
    ports: ["5432:5432"]          # exposed for IntelliJ DB tools
    volumes: [khatm_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khatm -d khatm"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [khatm-net]

  khatm-redis:
    image: redis:7
    container_name: khatm-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [khatm-net]

  khatm-api:
    build: .
    container_name: khatm-api
    environment:
      SPRING_PROFILES_ACTIVE: local,api
      SPRING_DATASOURCE_URL: jdbc:postgresql://khatm-postgres:5432/khatm
      SPRING_DATASOURCE_USERNAME: khatm
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-khatm_local_only}
      SPRING_DATA_REDIS_HOST: khatm-redis
      # KH-0.5 (spec FS-0.5 §7): SoftKeyProvider's PKCS#12 keystore passphrase. Must come from
      # env in any real deployment; this local-only default matches application.yml's 'local'
      # profile document so `docker compose up` works with zero setup.
      KHATM_KEYS_PASSPHRASE: ${KHATM_KEYS_PASSPHRASE:-khatm-local-dev-passphrase-change-me}
      # PublicUrlBuilder roots every self-referential URL here (today: the status-list URI a
      # wallet fetches). 'localhost' only resolves on THIS machine — a phone or any other device
      # on the LAN needs your machine's actual LAN IP instead. Before testing from a real device,
      # export KHATM_PUBLIC_BASE_URL=http://<your-LAN-IP>:8080 in the shell that runs `docker
      # compose up` (see README "Running locally"). Falls back to localhost for a same-machine
      # dev loop, matching application.yml's 'local' profile default.
      KHATM_PUBLIC_BASE_URL: ${KHATM_PUBLIC_BASE_URL:-http://localhost:8080}
    ports: ["8080:8080"]
    volumes: [khatm_keys:/var/khatm/keys]
    depends_on:
      khatm-postgres: { condition: service_healthy }
      khatm-redis:    { condition: service_healthy }
    networks: [khatm-net]

  khatm-worker:
    build: .
    container_name: khatm-worker
    environment:
      SPRING_PROFILES_ACTIVE: local,worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://khatm-postgres:5432/khatm
      SPRING_DATASOURCE_USERNAME: khatm
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-khatm_local_only}
      SPRING_DATA_REDIS_HOST: khatm-redis
      KHATM_KEYS_PASSPHRASE: ${KHATM_KEYS_PASSPHRASE:-khatm-local-dev-passphrase-change-me}
      # PublicUrlBuilder is wired regardless of role — same value as khatm-api above (see its
      # comment for the LAN-IP note).
      KHATM_PUBLIC_BASE_URL: ${KHATM_PUBLIC_BASE_URL:-http://localhost:8080}
    volumes: [khatm_keys:/var/khatm/keys]
    depends_on:
      khatm-postgres: { condition: service_healthy }
      khatm-redis:    { condition: service_healthy }
    networks: [khatm-net]

volumes:
  khatm_pgdata:
  khatm_keys:

networks:
  khatm-net:
    external: true
